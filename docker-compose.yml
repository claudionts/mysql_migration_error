services:
  db:
    image: postgres:16
    container_name: postgres_dev
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: postgres_migration_error_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d postgres_migration_error_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    container_name: phoenix_app
    environment:
      PHX_SERVER: "true"
      PORT: "4000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: postgres_migration_error_dev
      DB_USER: app
      DB_PASSWORD: apppass
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - deps:/app/deps
      - build:/app/_build
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -lc "
        mix deps.get &&
        mix ecto.create &&
        mix ecto.migrate &&
        mix phx.server
      "

volumes:
  postgres_data:
  deps:
  build:
